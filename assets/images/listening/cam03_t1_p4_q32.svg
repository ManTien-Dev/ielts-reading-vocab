<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-label="Bar chart showing number of people incapacitated with back pain per day for columns A, B and C">
  <rect width="420" height="250" rx="10" fill="#fbf9f4" stroke="#d8d2c5" stroke-width="1.2"/>
  <text x="210" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1f2421">People Incapacitated with Back Pain per Day</text>
  <!-- Y-axis gridlines -->
  <line x1="78" y1="200" x2="386" y2="200" stroke="#4a4842" stroke-width="1.5"/>
  <line x1="78" y1="48" x2="78" y2="200" stroke="#4a4842" stroke-width="1.5"/>
  <line x1="78" y1="164" x2="386" y2="164" stroke="#ded8cb" stroke-dasharray="3 3"/>
  <line x1="78" y1="128" x2="386" y2="128" stroke="#ded8cb" stroke-dasharray="3 3"/>
  <line x1="78" y1="92" x2="386" y2="92" stroke="#ded8cb" stroke-dasharray="3 3"/>
  <line x1="78" y1="56" x2="386" y2="56" stroke="#ded8cb" stroke-dasharray="3 3"/>
  <!-- Y-axis labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#57524a" text-anchor="end">
    <text x="70" y="204">0</text>
    <text x="70" y="168">250,000</text>
    <text x="70" y="132">500,000</text>
    <text x="70" y="96">750,000</text>
    <text x="70" y="60">1,000,000</text>
  </g>
  <!-- Bars: A = 250,000, B = 500,000, C = 750,000 -->
  <rect x="114" y="164" width="54" height="36" rx="3" fill="#2f663d"/>
  <rect x="206" y="128" width="54" height="72" rx="3" fill="#4f6d8a"/>
  <rect x="298" y="92" width="54" height="108" rx="3" fill="#b36d35"/>
  <!-- Bar Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1f2421" text-anchor="middle">
    <text x="141" y="222">Column A</text>
    <text x="233" y="222">Column B</text>
    <text x="325" y="222">Column C</text>
  </g>
</svg>
